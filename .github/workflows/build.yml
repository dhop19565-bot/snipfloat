name: Build DarcySnipTool EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pillow pystray pywin32 pyinstaller keyboard numpy
          pip install rapidocr-onnxruntime
          pip install pytesseract winsdk

      - name: Install Tesseract OCR (fallback engine)
        run: choco install tesseract -y --no-progress
        shell: pwsh

      - name: Stage Tesseract for bundling
        run: |
          $tessExe = (Get-Command tesseract -ErrorAction SilentlyContinue).Source
          if (-not $tessExe) { $tessExe = "C:\Program Files\Tesseract-OCR\tesseract.exe" }
          $tessDir = Split-Path $tessExe
          New-Item -ItemType Directory -Force -Path tesseract | Out-Null
          Copy-Item "$tessDir\*" -Destination tesseract -Recurse -Force
          if (Test-Path "$tessDir\tessdata") {
            Copy-Item "$tessDir\tessdata" -Destination tesseract -Recurse -Force
          }
          echo "Staged tesseract files:"
          Get-ChildItem tesseract | Select-Object Name
        shell: pwsh

      - name: Build EXE
        run: >
          python -c "from snip_tool import make_ico_file; make_ico_file()" ;
          pyinstaller --onefile --windowed --name DarcySnipTool --icon=darcysniptool.ico
          --add-data "tesseract;tesseract"
          --collect-all rapidocr_onnxruntime
          --collect-all onnxruntime
          --collect-data rapidocr_onnxruntime
          --hidden-import numpy
          --hidden-import onnxruntime
          --collect-all winsdk
          --exclude-module matplotlib
          --exclude-module scipy
          --exclude-module pandas
          --exclude-module pytest
          snip_tool.py --clean --noconfirm
        shell: pwsh

      - name: Show final size
        run: |
          Get-ChildItem dist | Select-Object Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length/1MB,2)}}
        shell: pwsh

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarcySnipTool-Windows
          path: dist/DarcySnipTool.exe
